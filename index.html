<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Reader — OVGU</title>

<!-- KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="if (typeof renderMathInDoc === 'function') renderMathInDoc()"></script>

<!-- marked.js -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>

<!-- highlight.js for code blocks -->
<link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- Mobile backdrop -->
  <div id="sidebar-backdrop" title="Close sidebar"></div>

  <!-- ── SIDEBAR ──────────────────────────────────────────────── -->
  <aside id="sidebar" aria-label="Course navigation sidebar">
    <div id="sidebar-header">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <h1>Study Reader</h1>
        <button id="sidebar-close-btn" class="icon-btn" title="Collapse Sidebar (⌘B)" aria-label="Collapse sidebar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="11 17 6 12 11 7"></polyline>
            <polyline points="18 17 13 12 18 7"></polyline>
          </svg>
        </button>
      </div>
    </div>
    <div id="sidebar-search">
      <input id="search-input" type="text" placeholder="Search notes…" autocomplete="off">
    </div>
    <nav id="sidebar-nav" role="navigation">
      <div id="nav-placeholder" style="padding:20px 16px;font-size:13px;color:var(--text-faint)">
        Loading courses…
      </div>
    </nav>
  </aside>

  <!-- ── MAIN ─────────────────────────────────────────────────── -->
  <main id="main">
    <div id="topbar">
      <button id="sidebar-toggle" title="Toggle Sidebar (⌘B)" aria-label="Toggle Sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"/>
          <path d="M9 3v18"/>
        </svg>
      </button>
      <div id="breadcrumb">
        <span class="bc-course">← select a note from the sidebar</span>
      </div>

      <!-- Highlighter Tool Palette (Icon-only) -->
      <div id="highlighter-tools" class="tool-palette" role="toolbar" aria-label="Highlighter Tools">
        <button class="palette-btn active" data-tool="read" title="Read Mode (✋) — Tap & scroll freely (Key: 0 or Esc)">
          <span class="icon">✋</span>
        </button>
        <button class="palette-btn" data-tool="yellow" title="Yellow Pen (🟡) — Drag Pencil to highlight directly (Key: 1)">
          <span class="swatch swatch-yellow"></span>
        </button>
        <button class="palette-btn" data-tool="green" title="Green Pen (🟢) — Drag Pencil to highlight directly (Key: 2)">
          <span class="swatch swatch-green"></span>
        </button>
        <button class="palette-btn" data-tool="red" title="Red Pen (🔴) — Drag Pencil to highlight directly (Key: 3)">
          <span class="swatch swatch-red"></span>
        </button>
        <button class="palette-btn" data-tool="eraser" title="Eraser (🧹) — Tap or drag over highlight to erase (Key: E)">
          <span class="icon">🧹</span>
        </button>
      </div>

      <!-- Sync / Refresh Button (Icon-only) -->
      <button id="sync-btn" class="topbar-action-btn" title="Refresh Notes (Key: R)">
        <span id="sync-icon">🔄</span>
      </button>

      <!-- Theme Button (Icon-only) -->
      <button id="theme-btn" class="topbar-action-btn" title="Toggle theme (Light / Dark)">
        <span id="theme-icon">🌙</span>
      </button>
    </div>

    <!-- Reading Progress Bar -->
    <div id="progress-bar-container"><div id="progress-bar"></div></div>

    <div id="scroll-area">
      <div id="content-wrap">
        <!-- Floating highlight toolbar -->
        <div id="hl-toolbar" class="hl-toolbar" role="toolbar" aria-label="Highlight toolbar">
          <button class="hl-btn hl-btn-yellow" data-color="yellow" title="Highlight Yellow (🟡)"></button>
          <button class="hl-btn hl-btn-green" data-color="green" title="Highlight Green (🟢)"></button>
          <button class="hl-btn hl-btn-red" data-color="red" title="Highlight Red (🔴)"></button>
          <div class="hl-sep"></div>
          <button class="hl-btn-clear" id="hl-clear-btn" title="Remove Highlight (✕)">✕</button>
        </div>

        <div id="welcome">
          <h2>Welcome to Study Reader</h2>
          <p>Select any note from the sidebar to start reading.<br>
          Math is rendered via KaTeX. Code is syntax-highlighted.<br>
          The note auto-refreshes when you save changes.</p>
          <div class="hint">http://localhost:7474</div>
        </div>
        <div id="loading">Loading…</div>
        <div id="error-box"></div>
        <article id="md-body"></article>
      </div>
    </div>
  </main>

</div>

<script src="app.js"></script>
</body>
</html>
