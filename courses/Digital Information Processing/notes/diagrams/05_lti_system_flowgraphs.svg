<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ============================================================ -->
  <!-- PANEL 1: FIR Feedforward (Moving Average) Filter            -->
  <!-- ============================================================ -->
  <g transform="translate(30, 25)">
    <!-- Container Box -->
    <rect x="0" y="0" width="880" height="215" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Title & Badge -->
    <text x="24" y="32" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="0.3px">
      1. Feedforward (FIR / Moving Average) Structure: <tspan fill="#f1f5f9" font-family="'JetBrains Mono', 'Fira Code', monospace">y[n] = 2·x[n] + x[n-1]</tspan>
    </text>
    <rect x="710" y="16" width="146" height="24" rx="12" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
    <text x="783" y="32" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Finite Impulse Response</text>

    <!-- Signal Rails (Orthogonal Manhattan Routing) -->
    <!-- Input x[n] to Pickoff Node -->
    <line x1="30" y1="95" x2="140" y2="95" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#arrow-gray)"/>
    <text x="40" y="82" fill="#f1f5f9" font-size="15" font-weight="700" font-family="'JetBrains Mono', monospace">x[n]</text>

    <!-- Pickoff Branch Node -->
    <circle cx="150" cy="95" r="5" fill="#38bdf8"/>

    <!-- Direct Path (Top Rail): to Multiplier -->
    <line x1="150" y1="95" x2="250" y2="95" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrow-blue)"/>

    <!-- Multiplier Block (×2) -->
    <rect x="250" y="73" width="70" height="44" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="285" y="100" fill="#38bdf8" font-size="15" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">× 2</text>
    <text x="285" y="62" fill="#94a3b8" font-size="10.5" text-anchor="middle">Gain b₀ = 2</text>

    <!-- Multiplier to Summer -->
    <line x1="320" y1="95" x2="445" y2="95" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrow-blue)"/>

    <!-- Delayed Path (Tap Drop): Orthogonal 90° down, then right, then up -->
    <line x1="150" y1="95" x2="150" y2="170" stroke="#fbbf24" stroke-width="2.2"/>
    <line x1="150" y1="170" x2="240" y2="170" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#arrow-amber)"/>

    <!-- Delay Block [ z⁻¹ ] -->
    <rect x="240" y="148" width="90" height="44" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <text x="285" y="176" fill="#fbbf24" font-size="16" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">z⁻¹</text>
    <text x="285" y="137" fill="#fbbf24" font-size="10.5" font-weight="600" text-anchor="middle">Unit Delay T</text>

    <!-- Delay Block to Summer (Right, then 90° UP into bottom of summer) -->
    <line x1="330" y1="170" x2="465" y2="170" stroke="#fbbf24" stroke-width="2.2"/>
    <line x1="465" y1="170" x2="465" y2="125" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
    <text x="390" y="162" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">x[n-1]</text>

    <!-- Summing Junction (Adder Circle) -->
    <circle cx="465" cy="95" r="18" fill="#0f172a" stroke="#34d399" stroke-width="2.2"/>
    <line x1="457" y1="95" x2="473" y2="95" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="465" y1="87" x2="465" y2="103" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Output Rail to y[n] -->
    <line x1="483" y1="95" x2="600" y2="95" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <text x="615" y="100" fill="#34d399" font-size="16" font-weight="700" font-family="'JetBrains Mono', monospace">y[n]</text>

    <!-- Side Explanation / Properties Card -->
    <rect x="670" y="60" width="190" height="135" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="684" y="84" fill="#f1f5f9" font-size="12" font-weight="700">FIR Properties:</text>
    <text x="684" y="106" fill="#94a3b8" font-size="11">• Strictly feedforward</text>
    <text x="684" y="126" fill="#94a3b8" font-size="11">• No feedback loops</text>
    <text x="684" y="146" fill="#38bdf8" font-size="11">• Always BIBO-stable</text>
    <text x="684" y="166" fill="#34d399" font-size="11" font-family="'JetBrains Mono', monospace">h[n] = 2δ[n] + δ[n-1]</text>
    <text x="684" y="184" fill="#94a3b8" font-size="10.5">Length L = 2 samples</text>
  </g>

  <!-- ============================================================ -->
  <!-- PANEL 2: IIR Feedback (Autoregressive) Filter               -->
  <!-- ============================================================ -->
  <g transform="translate(30, 255)">
    <!-- Container Box -->
    <rect x="0" y="0" width="880" height="215" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Title & Badge -->
    <text x="24" y="32" fill="#a78bfa" font-size="14" font-weight="700" letter-spacing="0.3px">
      2. Feedback (IIR / Autoregressive) Structure: <tspan fill="#f1f5f9" font-family="'JetBrains Mono', 'Fira Code', monospace">y[n] = x[n] - 3·y[n-1]</tspan>
    </text>
    <rect x="696" y="16" width="160" height="24" rx="12" fill="#581c87" fill-opacity="0.4" stroke="#7e22ce" stroke-width="1"/>
    <text x="776" y="32" fill="#c084fc" font-size="11" font-weight="600" text-anchor="middle">Infinite Impulse Response</text>

    <!-- Signal Rails (Orthogonal Manhattan Routing) -->
    <!-- Input x[n] straight into Summer -->
    <line x1="30" y1="95" x2="165" y2="95" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#arrow-gray)"/>
    <text x="40" y="82" fill="#f1f5f9" font-size="15" font-weight="700" font-family="'JetBrains Mono', monospace">x[n]</text>

    <!-- Summing Junction (Adder Circle) -->
    <circle cx="185" cy="95" r="18" fill="#0f172a" stroke="#34d399" stroke-width="2.2"/>
    <line x1="177" y1="95" x2="193" y2="95" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="185" y1="87" x2="185" y2="103" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Forward Path to Output Branch Node -->
    <line x1="203" y1="95" x2="470" y2="95" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="470" cy="95" r="5" fill="#a78bfa"/>

    <!-- Continue Forward to y[n] Output -->
    <line x1="470" y1="95" x2="600" y2="95" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <text x="615" y="100" fill="#34d399" font-size="16" font-weight="700" font-family="'JetBrains Mono', monospace">y[n]</text>

    <!-- Feedback Loop (Strict 90° Manhattan): -->
    <!-- 1. Drop down from Output Node at (470, 95) to (470, 170) -->
    <line x1="470" y1="95" x2="470" y2="170" stroke="#a78bfa" stroke-width="2.2"/>

    <!-- 2. Travel left through Unit Delay -->
    <line x1="470" y1="170" x2="415" y2="170" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#arrow-purple)"/>

    <!-- Delay Block [ z⁻¹ ] -->
    <rect x="325" y="148" width="90" height="44" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <text x="370" y="176" fill="#fbbf24" font-size="16" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">z⁻¹</text>
    <text x="370" y="137" fill="#fbbf24" font-size="10.5" font-weight="600" text-anchor="middle">Previous Output y[n-1]</text>

    <!-- 3. Travel left from Delay to Feedback Multiplier -->
    <line x1="325" y1="170" x2="280" y2="170" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#arrow-purple)"/>

    <!-- Feedback Gain Block [ × (-3) ] -->
    <rect x="200" y="148" width="80" height="44" rx="6" fill="#0f172a" stroke="#f87171" stroke-width="2"/>
    <text x="240" y="176" fill="#f87171" font-size="15" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">× (-3)</text>
    <text x="240" y="137" fill="#f87171" font-size="10.5" text-anchor="middle">Coeff -a₁ = -3</text>

    <!-- 4. Travel left and turn 90° UP into the bottom of Summer at (185, 95) -->
    <line x1="200" y1="170" x2="185" y2="170" stroke="#f87171" stroke-width="2.2"/>
    <line x1="185" y1="170" x2="185" y2="125" stroke="#f87171" stroke-width="2.2" marker-end="url(#arrow-red)"/>

    <!-- Side Explanation / Properties Card -->
    <rect x="670" y="60" width="190" height="135" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="684" y="84" fill="#f1f5f9" font-size="12" font-weight="700">IIR Properties:</text>
    <text x="684" y="106" fill="#a78bfa" font-size="11">• Recursive feedback loop</text>
    <text x="684" y="126" fill="#94a3b8" font-size="11">• Infinite impulse response</text>
    <text x="684" y="146" fill="#f87171" font-size="11">• Pole at z = -3 (|z| &gt; 1)</text>
    <text x="684" y="166" fill="#f87171" font-size="11" font-weight="600">⚠ Unstable for causal h[n]</text>
    <text x="684" y="184" fill="#94a3b8" font-size="10.5">ROC: |z| &gt; 3 excludes circle</text>
  </g>
</svg>