<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="100%" height="auto">
  <defs>
    <style>
      .node-root { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 6px; }
      .node-internal { fill: #f8fafc; stroke: #64748b; stroke-width: 1.2; rx: 5px; }
      .leaf-good { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 5px; }
      .leaf-neutral { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; rx: 5px; }
      .leaf-bad { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; rx: 5px; }
      .txt-title { font-family: Calibri, Aptos, 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: 700; text-anchor: middle; fill: #0f172a; }
      .txt-leaf { font-family: Calibri, Aptos, 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: 700; text-anchor: middle; }
      .edge { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
      .br-rect { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 3px; }
      .br-txt { font-family: Calibri, Aptos, 'Segoe UI', Arial, sans-serif; font-size: 9.5px; font-weight: 600; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <!-- Connectors from Root -->
  <path d="M 280 38 L 130 75" class="edge" />
  <path d="M 340 38 L 340 75" class="edge" />
  <path d="M 400 38 L 550 75" class="edge" />

  <!-- Root Branch Labels -->
  <rect x="180" y="45" width="42" height="15" class="br-rect" />
  <text x="201" y="56" class="br-txt">Nice</text>

  <rect x="305" y="47" width="70" height="15" class="br-rect" />
  <text x="340" y="58" class="br-txt">No Interaction</text>

  <rect x="460" y="45" width="42" height="15" class="br-rect" />
  <text x="481" y="56" class="br-txt">Mean</text>

  <!-- Root Node -->
  <g transform="translate(240, 8)">
    <rect width="200" height="32" class="node-root" />
    <text x="100" y="20" class="txt-title" fill="#1e40af">How treated others?</text>
  </g>

  <!-- ================= LEFT SUBTREE (NICE) ================= -->
  <!-- Level 1 Node: Noisiness <= 5? -->
  <g transform="translate(60, 75)">
    <rect width="140" height="28" class="node-internal" />
    <text x="70" y="18" class="txt-title">Noisiness ≤ 5?</text>
  </g>

  <!-- Edges from Noisiness -->
  <path d="M 95 103 L 55 140" class="edge" />
  <path d="M 165 103 L 205 130" class="edge" />

  <rect x="58" y="112" width="30" height="14" class="br-rect" />
  <text x="73" y="123" class="br-txt">Yes</text>

  <rect x="175" y="110" width="26" height="14" class="br-rect" />
  <text x="188" y="121" class="br-txt">No</text>

  <!-- Leaf: Good -->
  <g transform="translate(15, 140)">
    <rect width="80" height="26" class="leaf-good" />
    <text x="40" y="17" class="txt-leaf" fill="#065f46">Good</text>
  </g>

  <!-- Level 2 Node: Chores? -->
  <g transform="translate(145, 130)">
    <rect width="120" height="26" class="node-internal" />
    <text x="60" y="17" class="txt-title">Chores fulfilled?</text>
  </g>

  <!-- Edges from Chores -->
  <path d="M 175 156 L 145 190" class="edge" />
  <path d="M 235 156 L 265 190" class="edge" />

  <rect x="130" y="166" width="46" height="14" class="br-rect" />
  <text x="153" y="177" class="br-txt">All / Most</text>

  <rect x="235" y="166" width="46" height="14" class="br-rect" />
  <text x="258" y="177" class="br-txt">Few / None</text>

  <g transform="translate(110, 190)">
    <rect width="70" height="26" class="leaf-good" />
    <text x="35" y="17" class="txt-leaf" fill="#065f46">Good</text>
  </g>

  <g transform="translate(230, 190)">
    <rect width="70" height="26" class="leaf-neutral" />
    <text x="35" y="17" class="txt-leaf" fill="#92400e">Neutral</text>
  </g>

  <!-- ================= MIDDLE SUBTREE (NO INTERACTION) ================= -->
  <!-- Level 1 Node: Chores? -->
  <g transform="translate(280, 75)">
    <rect width="120" height="28" class="node-internal" />
    <text x="60" y="18" class="txt-title">Chores fulfilled?</text>
  </g>

  <!-- Edges from Middle Chores -->
  <path d="M 315 103 L 305 140" class="edge" />
  <path d="M 365 103 L 385 140" class="edge" />

  <rect x="282" y="112" width="44" height="14" class="br-rect" />
  <text x="304" y="123" class="br-txt">All / Most</text>

  <rect x="368" y="112" width="46" height="14" class="br-rect" />
  <text x="391" y="123" class="br-txt">Few / None</text>

  <g transform="translate(270, 140)">
    <rect width="70" height="26" class="leaf-neutral" />
    <text x="35" y="17" class="txt-leaf" fill="#92400e">Neutral</text>
  </g>

  <g transform="translate(355, 140)">
    <rect width="70" height="26" class="leaf-bad" />
    <text x="35" y="17" class="txt-leaf" fill="#991b1b">Bad</text>
  </g>

  <!-- ================= RIGHT SUBTREE (MEAN) ================= -->
  <!-- Level 1 Node: Age <= 4? -->
  <g transform="translate(485, 75)">
    <rect width="130" height="28" class="node-internal" />
    <text x="65" y="18" class="txt-title">Age ≤ 4? (Toddler)</text>
  </g>

  <!-- Edges from Age -->
  <path d="M 520 103 L 490 140" class="edge" />
  <path d="M 580 103 L 610 140" class="edge" />

  <rect x="482" y="112" width="30" height="14" class="br-rect" />
  <text x="497" y="123" class="br-txt">Yes</text>

  <rect x="585" y="112" width="26" height="14" class="br-rect" />
  <text x="598" y="123" class="br-txt">No</text>

  <g transform="translate(455, 140)">
    <rect width="70" height="26" class="leaf-neutral" />
    <text x="35" y="17" class="txt-leaf" fill="#92400e">Neutral</text>
  </g>

  <g transform="translate(575, 140)">
    <rect width="70" height="26" class="leaf-bad" />
    <text x="35" y="17" class="txt-leaf" fill="#991b1b">Bad</text>
  </g>
</svg>
