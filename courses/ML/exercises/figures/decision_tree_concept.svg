<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 145" width="100%" height="auto">
  <defs>
    <style>
      .node-root { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 5px; }
      .node-internal { fill: #f8fafc; stroke: #64748b; stroke-width: 1.2; rx: 5px; }
      .leaf-pos { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 5px; }
      .leaf-neg { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; rx: 5px; }
      .txt-title { font-family: Calibri, Aptos, 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: 700; text-anchor: middle; fill: #1e40af; }
      .txt-internal { font-family: Calibri, Aptos, 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: 700; text-anchor: middle; fill: #1e293b; }
      .txt-leaf { font-family: Calibri, Aptos, 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: 700; text-anchor: middle; }
      .edge { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
      .br-rect { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 3px; }
      .br-txt { font-family: Calibri, Aptos, 'Segoe UI', Arial, sans-serif; font-size: 9.5px; font-weight: 600; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <!-- Connectors -->
  <!-- Root to Left Leaf -->
  <path d="M 230 32 L 120 62" class="edge" />
  <!-- Root to Right Internal -->
  <path d="M 310 32 L 400 62" class="edge" />
  <!-- Internal to Leaf Pos -->
  <path d="M 360 88 L 330 112" class="edge" />
  <!-- Internal to Leaf Neg -->
  <path d="M 440 88 L 470 112" class="edge" />

  <!-- Branch Labels -->
  <rect x="150" y="40" width="44" height="14" class="br-rect" />
  <text x="172" y="51" class="br-txt">Sunny</text>

  <rect x="335" y="40" width="44" height="14" class="br-rect" />
  <text x="357" y="51" class="br-txt">Rainy</text>

  <rect x="320" y="94" width="38" height="13" class="br-rect" />
  <text x="339" y="104" class="br-txt">Weak</text>

  <rect x="440" y="94" width="40" height="13" class="br-rect" />
  <text x="460" y="104" class="br-txt">Strong</text>

  <!-- Level 0: Root Node -->
  <g transform="translate(195, 8)">
    <rect width="150" height="25" class="node-root" />
    <text x="75" y="17" class="txt-title">Root: Outlook?</text>
  </g>

  <!-- Level 1: Left Leaf -->
  <g transform="translate(65, 62)">
    <rect width="105" height="26" class="leaf-pos" />
    <text x="52.5" y="17" class="txt-leaf" fill="#065f46">Leaf: Play (+)</text>
  </g>

  <!-- Level 1: Right Internal Node -->
  <g transform="translate(325, 62)">
    <rect width="150" height="26" class="node-internal" />
    <text x="75" y="17" class="txt-internal">Internal: Wind?</text>
  </g>

  <!-- Level 2: Leaves -->
  <g transform="translate(280, 112)">
    <rect width="95" height="24" class="leaf-pos" />
    <text x="47.5" y="16" class="txt-leaf" fill="#065f46">Leaf: Play (+)</text>
  </g>

  <g transform="translate(425, 112)">
    <rect width="90" height="24" class="leaf-neg" />
    <text x="45" y="16" class="txt-leaf" fill="#991b1b">Leaf: No (-)</text>
  </g>
</svg>
