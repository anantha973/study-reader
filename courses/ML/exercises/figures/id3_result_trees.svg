<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120" width="100%" height="auto">
  <defs>
    <style>
      .node-root { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 5px; }
      .leaf-pos { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 5px; }
      .leaf-neg { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; rx: 5px; }
      .txt-title { font-family: Calibri, Aptos, 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: 700; text-anchor: middle; fill: #1e40af; }
      .txt-leaf { font-family: Calibri, Aptos, 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .opt-hdr { font-family: Calibri, Aptos, 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #475569; }
      .edge { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
      .br-rect { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 3px; }
      .br-txt { font-family: Calibri, Aptos, 'Segoe UI', Arial, sans-serif; font-size: 9.5px; font-weight: 600; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <!-- ================= OPTION A: SKY ================= -->
  <text x="20" y="15" class="opt-hdr">Option A: Split on Sky (Gain = 0.8113)</text>

  <!-- Root Sky -->
  <g transform="translate(110, 24)">
    <rect width="100" height="26" class="node-root" />
    <text x="50" y="17" class="txt-title">Sky?</text>
  </g>

  <!-- Edges -->
  <path d="M 130 50 L 55 82" class="edge" />
  <path d="M 160 50 L 160 82" class="edge" />
  <path d="M 190 50 L 265 82" class="edge" />

  <!-- Branch labels -->
  <rect x="65" y="56" width="38" height="14" class="br-rect" />
  <text x="84" y="67" class="br-txt">Sunny</text>

  <rect x="142" y="56" width="36" height="14" class="br-rect" />
  <text x="160" y="67" class="br-txt">Cloudy</text>

  <rect x="220" y="56" width="36" height="14" class="br-rect" />
  <text x="238" y="67" class="br-txt">Rainy</text>

  <!-- Leaves -->
  <g transform="translate(25, 82)">
    <rect width="60" height="24" class="leaf-pos" />
    <text x="30" y="16" class="txt-leaf" fill="#065f46">+ (Yes)</text>
  </g>

  <g transform="translate(130, 82)">
    <rect width="60" height="24" class="leaf-pos" />
    <text x="30" y="16" class="txt-leaf" fill="#065f46">+ (Def)</text>
  </g>

  <g transform="translate(235, 82)">
    <rect width="60" height="24" class="leaf-neg" />
    <text x="30" y="16" class="txt-leaf" fill="#991b1b">- (No)</text>
  </g>

  <!-- Divider Line -->
  <line x1="335" y1="10" x2="335" y2="115" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4" />

  <!-- ================= OPTION B: TEMPERATURE ================= -->
  <text x="360" y="15" class="opt-hdr">Option B: Split on Temperature (Gain = 0.8113)</text>

  <!-- Root Temperature -->
  <g transform="translate(435, 24)">
    <rect width="130" height="26" class="node-root" />
    <text x="65" y="17" class="txt-title">Temperature?</text>
  </g>

  <!-- Edges -->
  <path d="M 470 50 L 415 82" class="edge" />
  <path d="M 530 50 L 585 82" class="edge" />

  <!-- Branch labels -->
  <rect x="415" y="56" width="36" height="14" class="br-rect" />
  <text x="433" y="67" class="br-txt">Warm</text>

  <rect x="545" y="56" width="34" height="14" class="br-rect" />
  <text x="562" y="67" class="br-txt">Cold</text>

  <!-- Leaves -->
  <g transform="translate(385, 82)">
    <rect width="60" height="24" class="leaf-pos" />
    <text x="30" y="16" class="txt-leaf" fill="#065f46">+ (Yes)</text>
  </g>

  <g transform="translate(555, 82)">
    <rect width="60" height="24" class="leaf-neg" />
    <text x="30" y="16" class="txt-leaf" fill="#991b1b">- (No)</text>
  </g>
</svg>
