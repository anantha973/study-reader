<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .node-card { rx: 8px; stroke-width: 1.5px; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; }
      .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
      .node-val { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 700; }
      .link-line { stroke: #cbd5e1; stroke-width: 2px; fill: none; }
      .link-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; }
      .badge { rx: 4px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" class="bg" />

  <!-- Title & Subtitle -->
  <text x="40" y="42" class="title">Bayesian Evidence Decomposition: 100,000 Patient Cohort</text>
  <text x="40" y="64" class="subtitle">Visualizing the Base Rate Fallacy: Why a 98% sensitive test results in only 20.85% diagnostic certainty on Test 1</text>

  <!-- Level 0: Root Population -->
  <g transform="translate(360, 90)">
    <rect width="240" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="120" y="26" text-anchor="middle" class="node-title" fill="#0f172a">Total Population</text>
    <text x="120" y="46" text-anchor="middle" class="node-val" fill="#2563eb">100,000 Patients</text>
  </g>

  <!-- Connecting Lines to Disease States -->
  <path d="M 430 150 L 430 185 L 220 185 L 220 210" class="link-line" stroke="#ef4444" />
  <path d="M 530 150 L 530 185 L 720 185 L 720 210" class="link-line" stroke="#10b981" />

  <!-- Labels on Branches -->
  <rect x="250" y="172" width="120" height="22" rx="4" fill="#fee2e2" />
  <text x="310" y="187" text-anchor="middle" font-family="sans-serif" font-size="11px" font-weight="600" fill="#b91c1c">Prior P(c) = 0.8%</text>

  <rect x="580" y="172" width="130" height="22" rx="4" fill="#d1fae5" />
  <text x="645" y="187" text-anchor="middle" font-family="sans-serif" font-size="11px" font-weight="600" fill="#047857">Prior P(¬c) = 99.2%</text>

  <!-- Level 1: Disease States -->
  <!-- Cancer State -->
  <g transform="translate(100, 210)">
    <rect width="240" height="64" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
    <text x="120" y="26" text-anchor="middle" class="node-title" fill="#991b1b">Cancer Present (c)</text>
    <text x="120" y="48" text-anchor="middle" class="node-val" fill="#b91c1c">800 Patients</text>
  </g>

  <!-- Healthy State -->
  <g transform="translate(600, 210)">
    <rect width="240" height="64" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
    <text x="120" y="26" text-anchor="middle" class="node-title" fill="#166534">Cancer Absent (¬c)</text>
    <text x="120" y="48" text-anchor="middle" class="node-val" fill="#15803d">99,200 Patients</text>
  </g>

  <!-- Connecting Lines to Test Outcomes -->
  <!-- From Cancer -->
  <path d="M 170 274 L 170 310 L 90 310 L 90 330" class="link-line" />
  <path d="M 270 274 L 270 310 L 290 310 L 290 330" class="link-line" />

  <!-- From Healthy -->
  <path d="M 670 274 L 670 310 L 610 310 L 610 330" class="link-line" />
  <path d="M 770 274 L 770 310 L 810 310 L 810 330" class="link-line" />

  <!-- Level 2: Test Outcomes -->
  <!-- True Positives (Cancer & Test +) -->
  <g transform="translate(20, 330)">
    <rect width="180" height="64" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="90" y="22" text-anchor="middle" class="node-title" fill="#c2410c">True Positive (+|c)</text>
    <text x="90" y="38" text-anchor="middle" class="node-desc">Sensitivity: 98%</text>
    <text x="90" y="54" text-anchor="middle" class="node-val" fill="#c2410c">784 Patients</text>
  </g>

  <!-- False Negatives (Cancer & Test -) -->
  <g transform="translate(220, 330)">
    <rect width="160" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="80" y="22" text-anchor="middle" class="node-title" fill="#64748b">False Negative (-|c)</text>
    <text x="80" y="38" text-anchor="middle" class="node-desc">Error: 2%</text>
    <text x="80" y="54" text-anchor="middle" class="node-val" fill="#64748b">16 Patients</text>
  </g>

  <!-- False Positives (Healthy & Test +) -->
  <g transform="translate(520, 330)">
    <rect width="180" height="64" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="90" y="22" text-anchor="middle" class="node-title" fill="#b91c1c">False Positive (+|¬c)</text>
    <text x="90" y="38" text-anchor="middle" class="node-desc">False Alarm: 3%</text>
    <text x="90" y="54" text-anchor="middle" class="node-val" fill="#dc2626">2,976 Patients</text>
  </g>

  <!-- True Negatives (Healthy & Test -) -->
  <g transform="translate(720, 330)">
    <rect width="180" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="90" y="22" text-anchor="middle" class="node-title" fill="#64748b">True Negative (-|¬c)</text>
    <text x="90" y="38" text-anchor="middle" class="node-desc">Specificity: 97%</text>
    <text x="90" y="54" text-anchor="middle" class="node-val" fill="#64748b">96,224 Patients</text>
  </g>

  <!-- Synthesis / Convergence Panel -->
  <g transform="translate(40, 420)">
    <rect width="880" height="80" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"/>
    
    <!-- Test 1 Calculation -->
    <text x="24" y="28" font-family="sans-serif" font-size="13px" font-weight="700" fill="#1e3a8a">Test 1 Diagnosis Convergence:</text>
    <text x="24" y="50" font-family="sans-serif" font-size="12px" fill="#334155">All Positive Test Callouts = 784 (TP) + 2,976 (FP) = <tspan font-weight="700" fill="#1e293b">3,760 total positives</tspan></text>
    <text x="24" y="68" font-family="monospace" font-size="13px" font-weight="700" fill="#2563eb">P(cancer | +) = 784 / 3,760 = 49 / 235 ≈ 20.85% (Patient likely healthy!)</text>

    <!-- Test 2 Calculation -->
    <path d="M 520 12 L 520 68" stroke="#cbd5e1" stroke-width="1"/>
    <text x="545" y="28" font-family="sans-serif" font-size="13px" font-weight="700" fill="#15803d">Test 2 Sequential Update (Independent):</text>
    <text x="545" y="50" font-family="sans-serif" font-size="12px" fill="#334155">Prior shifts from 0.8% → 20.85%. Likelihood ratio = 0.98 / 0.03 = 32.67×</text>
    <text x="545" y="68" font-family="monospace" font-size="13px" font-weight="700" fill="#15803d">P(cancer | +, +) = 2,401 / 2,680 ≈ 89.59% (Diagnosis shifts to Cancer!)</text>
  </g>
</svg>