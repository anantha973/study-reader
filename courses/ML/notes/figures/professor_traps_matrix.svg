<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .col-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .row-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #1e293b; }
      .cell-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #334155; line-height: 1.4; }
      .code-pill { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; font-weight: 600; }
    </style>
  </defs>

  <rect width="960" height="420" class="bg" />

  <text x="40" y="38" class="title">The Three Data Pathologies in Bayesian Learning</text>
  <text x="40" y="58" class="subtitle">A definitive distinction matrix between Missing Values, Zero-Frequency Attributes, and OOV Text Tokens</text>

  <!-- Table Outline -->
  <g transform="translate(40, 80)">
    <!-- Header Row -->
    <rect x="0" y="0" width="880" height="45" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="80" y="28" text-anchor="middle" class="col-header" fill="#475569">Dimension</text>
    <text x="280" y="28" text-anchor="middle" class="col-header" fill="#0284c7">1. Missing Values</text>
    <text x="540" y="28" text-anchor="middle" class="col-header" fill="#d97706">2. Zero-Frequency Problem</text>
    <text x="770" y="28" text-anchor="middle" class="col-header" fill="#7c3aed">3. Out-of-Vocabulary (OOV)</text>

    <!-- Row 1: Root Cause -->
    <g transform="translate(0, 55)">
      <rect x="0" y="0" width="880" height="60" rx="4" fill="#ffffff" stroke="#e2e8f0" />
      <text x="80" y="35" text-anchor="middle" class="row-label">Root Cause</text>
      <text x="170" y="26" class="cell-text">Feature was never measured or</text>
      <text x="170" y="44" class="cell-text">recorded in the test/train record.</text>
      
      <text x="420" y="26" class="cell-text">Feature value was observed, but never</text>
      <text x="420" y="44" class="cell-text">co-occurred with target class v in train data.</text>

      <text x="670" y="26" class="cell-text">A novel word/token appears in test email</text>
      <text x="670" y="44" class="cell-text">that does not exist in Vocabulary V.</text>
    </g>

    <!-- Row 2: Mathematical Consequence -->
    <g transform="translate(0, 125)">
      <rect x="0" y="0" width="880" height="65" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="80" y="38" text-anchor="middle" class="row-label">Math Impact</text>
      
      <text x="170" y="26" class="cell-text">Attribute aᵢ has no entry in x.</text>
      <text x="170" y="44" class="code-pill" fill="#0284c7">Factor P(aᵢ | v) is undefined.</text>
      
      <text x="420" y="26" class="cell-text">MLE estimates P(aᵢ | v) = 0 / n = 0.</text>
      <text x="420" y="44" class="code-pill" fill="#d97706">Wipes product ∏ P(a | v) to absolute 0.</text>

      <text x="670" y="26" class="cell-text">Token w has no parameter P(w | c).</text>
      <text x="670" y="44" class="code-pill" fill="#7c3aed">Count n_k = 0; forces product to 0.</text>
    </g>

    <!-- Row 3: Correct Remedy -->
    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="880" height="110" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="80" y="58" text-anchor="middle" class="row-label">Exact Solution</text>
      
      <rect x="165" y="10" width="230" height="90" rx="4" fill="#f0f9ff" stroke="#bae6fd" />
      <text x="175" y="32" class="code-pill" fill="#0369a1">Marginalization / Omission</text>
      <text x="175" y="52" class="cell-text">Simply drop P(aᵢ | v) from the</text>
      <text x="175" y="70" class="cell-text">product. (Under conditional indep,</text>
      <text x="175" y="88" class="cell-text">marginalizing over aᵢ sums to 1.0).</text>

      <rect x="415" y="10" width="235" height="90" rx="4" fill="#fffbeb" stroke="#fde68a" />
      <text x="425" y="32" class="code-pill" fill="#b45309">m-Estimate Smoothing</text>
      <text x="425" y="52" font-family="monospace" font-size="11px" font-weight="700" fill="#92400e">P(aᵢ|v) = (n_c + m·p)/(n + m)</text>
      <text x="425" y="70" class="cell-text">Add virtual prior weight m (e.g. 1)</text>
      <text x="425" y="88" class="cell-text">with uniform distribution p = 1/k.</text>

      <rect x="665" y="10" width="205" height="90" rx="4" fill="#faf5ff" stroke="#e9d5ff" />
      <text x="675" y="32" class="code-pill" fill="#6d28d9">Laplace Vocabulary Smoothing</text>
      <text x="675" y="52" font-family="monospace" font-size="11px" font-weight="700" fill="#5b21b6">P(w|c) = (n_k + 1)/(n + |V|)</text>
      <text x="675" y="70" class="cell-text">Add 1 to numerator and |V|</text>
      <text x="675" y="88" class="cell-text">to total document word count.</text>
    </g>
  </g>
</svg>