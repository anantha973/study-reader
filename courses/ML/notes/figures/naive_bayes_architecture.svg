<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .step-card { rx: 8px; stroke-width: 1.5px; }
      .step-num { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .formula { font-family: "Cambria Math", "Times New Roman", Georgia, serif; font-size: 14px; font-weight: 600; }
      .param-box { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; }
      .arrow { stroke: #3b82f6; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6" />
    </marker>
  </defs>

  <rect width="960" height="400" class="bg" />

  <text x="40" y="38" class="title">Naive Bayes: The Complexity Collapse Pipeline</text>
  <text x="40" y="58" class="subtitle">From intractable Joint Bayesian Inference to practical Linear-Time Classification via Conditional Independence</text>

  <!-- Step 1: True Bayes Rule -->
  <g transform="translate(40, 85)">
    <rect width="250" height="180" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="12" y="12" width="60" height="20" rx="4" fill="#e2e8f0" />
    <text x="42" y="26" text-anchor="middle" class="step-num" fill="#475569">STEP 1</text>
    <text x="14" y="54" class="step-title" fill="#0f172a">Exact Bayes' Theorem</text>
    
    <rect x="14" y="66" width="222" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1" />
    <text x="125" y="95" text-anchor="middle" class="formula" fill="#1e3a8a">P(v | x) = [P(x | v) · P(v)] / P(x)</text>
    
    <text x="14" y="132" class="param-box" fill="#475569">Evidence denominator P(x) is a normalizer.</text>
    <text x="14" y="150" class="param-box" fill="#475569">Full joint P(a₁, ..., aₙ | v) requires</text>
    <text x="14" y="168" class="param-box" font-weight="700" fill="#dc2626">Parameters: (2ⁿ - 1) · |V|  (Exponential!)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 295 175 L 340 175" class="arrow" marker-end="url(#arrowhead)" />
  <text x="318" y="165" text-anchor="middle" font-family="sans-serif" font-size="10px" font-weight="600" fill="#64748b">Drop P(x)</text>

  <!-- Step 2: MAP Hypothesis -->
  <g transform="translate(350, 85)">
    <rect width="250" height="180" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="12" y="12" width="60" height="20" rx="4" fill="#dbeafe" />
    <text x="42" y="26" text-anchor="middle" class="step-num" fill="#1d4ed8">STEP 2</text>
    <text x="14" y="54" class="step-title" fill="#1e3a8a">Maximum-A-Posteriori (MAP)</text>
    
    <rect x="14" y="66" width="222" height="48" rx="6" fill="#ffffff" stroke="#93c5fd" />
    <text x="125" y="95" text-anchor="middle" class="formula" fill="#1d4ed8">v_MAP = argmax P(x | v) · P(v)</text>
    
    <text x="14" y="132" class="param-box" fill="#1e40af">Denominator P(x) is constant for all v ∈ V.</text>
    <text x="14" y="150" class="param-box" fill="#1e40af">Optimization goal is unchanged.</text>
    <text x="14" y="168" class="param-box" font-weight="700" fill="#b45309">Still blocked: Joint P(x | v) is intractable.</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 605 175 L 655 175" class="arrow" marker-end="url(#arrowhead)" stroke="#ea580c" />
  <text x="630" y="155" text-anchor="middle" font-family="sans-serif" font-size="10px" font-weight="700" fill="#ea580c">Assume</text>
  <text x="630" y="168" text-anchor="middle" font-family="sans-serif" font-size="10px" font-weight="700" fill="#ea580c">Indep.</text>

  <!-- Step 3: Naive Bayes -->
  <g transform="translate(665, 85)">
    <rect width="255" height="180" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <rect x="12" y="12" width="60" height="20" rx="4" fill="#dcfce7" />
    <text x="42" y="26" text-anchor="middle" class="step-num" fill="#15803d">STEP 3</text>
    <text x="14" y="54" class="step-title" fill="#14532d">Naive Bayes Classifier (v_NB)</text>
    
    <rect x="14" y="66" width="227" height="48" rx="6" fill="#ffffff" stroke="#86efac" />
    <text x="127" y="95" text-anchor="middle" class="formula" fill="#15803d">v_NB = argmax P(v) ∏ P(aᵢ | v)</text>
    
    <text x="14" y="132" class="param-box" fill="#166534">Factorization: P(x|v) = ∏ P(aᵢ | v).</text>
    <text x="14" y="150" class="param-box" fill="#166534">Each 1D feature estimated separately.</text>
    <text x="14" y="168" class="param-box" font-weight="700" fill="#15803d">Parameters: n · k · |V|  (Strictly Linear!)</text>
  </g>

  <!-- Comparison Banner at Bottom -->
  <g transform="translate(40, 285)">
    <rect width="880" height="95" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="24" y="28" font-family="sans-serif" font-size="13px" font-weight="700" fill="#0f172a">Concrete Example (Binary Features: n = 50 attributes, |V| = 2 classes):</text>
    
    <!-- Without Naive Bayes -->
    <rect x="24" y="40" width="395" height="42" rx="4" fill="#fee2e2" stroke="#fca5a5" />
    <text x="36" y="58" font-family="sans-serif" font-size="11.5px" font-weight="700" fill="#991b1b">Full Joint Bayesian Model (No Independence):</text>
    <text x="36" y="74" font-family="monospace" font-size="12px" fill="#b91c1c">(2⁵⁰ - 1) × 2 ≈ 2.25 × 10¹⁵ parameters (Impossible to train)</text>

    <!-- With Naive Bayes -->
    <rect x="445" y="40" width="445" height="42" rx="4" fill="#dcfce7" stroke="#86efac" />
    <text x="457" y="58" font-family="sans-serif" font-size="11.5px" font-weight="700" fill="#14532d">Naive Bayes Model (Conditional Independence):</text>
    <text x="457" y="74" font-family="monospace" font-size="12px" fill="#15803d">50 × 2 × 2 = 200 parameters (Trained reliably on tiny datasets!)</text>
  </g>
</svg>