<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .card-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #334155; }
      .bar-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; }
      .num { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="400" class="bg" />

  <text x="40" y="38" class="title">Zero-Frequency Collapse vs. Bayesian m-Estimate Regularization</text>
  <text x="40" y="58" class="subtitle">Demonstration on Task 3.3 (Instance i₂ = overcast, mild, normal, weak): Why smoothing saves probabilities</text>

  <!-- Left Column: MLE (The Problem) -->
  <g transform="translate(40, 85)">
    <rect width="425" height="200" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5" />
    <rect x="16" y="14" width="160" height="24" rx="4" fill="#ffe4e6" />
    <text x="96" y="31" text-anchor="middle" font-family="sans-serif" font-size="12px" font-weight="700" fill="#be123c">Maximum Likelihood (MLE)</text>
    
    <text x="16" y="66" class="card-body" font-weight="600" fill="#881337">Overcast has count n_c = 0 in class "no":</text>
    <rect x="16" y="74" width="393" height="32" rx="4" fill="#ffffff" stroke="#fecdd3" />
    <text x="26" y="95" font-family="monospace" font-size="13px" font-weight="700" fill="#e11d48">P(overcast | no) = 0 / 3 = 0.000  (FATAL!)</text>

    <text x="16" y="126" class="card-body">Because probabilities multiply, one zero wipes out all other evidence:</text>
    <text x="16" y="144" font-family="monospace" font-size="12px" fill="#475569">P'(no) = 0.30 × 0.00 × 0.67 × 0.33 × 0.33 = 0.000</text>

    <!-- Visual Bar Representation -->
    <text x="16" y="172" class="bar-label" fill="#1e293b">Posterior P(yes): 100.0%  |  P(no): 0.0%</text>
    <rect x="16" y="178" width="393" height="14" rx="3" fill="#e2e8f0" />
    <rect x="16" y="178" width="393" height="14" rx="3" fill="#16a34a" />
  </g>

  <!-- Right Column: m-Estimate (The Solution) -->
  <g transform="translate(495, 85)">
    <rect width="425" height="200" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
    <rect x="16" y="14" width="180" height="24" rx="4" fill="#dcfce7" />
    <text x="106" y="31" text-anchor="middle" font-family="sans-serif" font-size="12px" font-weight="700" fill="#15803d">m-Estimate (m = 1, p = 1/k)</text>
    
    <text x="16" y="66" class="card-body" font-weight="600" fill="#14532d">Bayesian pseudo-count smoothing (Slide 31):</text>
    <rect x="16" y="74" width="393" height="32" rx="4" fill="#ffffff" stroke="#bbf7d0" />
    <text x="26" y="95" font-family="monospace" font-size="13px" font-weight="700" fill="#15803d">P(overcast | no) = (0 + 1 · 1/3) / (3 + 1) = 1/12 ≈ 8.33%</text>

    <text x="16" y="126" class="card-body">The product receives non-zero evidence from other positive attributes:</text>
    <text x="16" y="144" font-family="monospace" font-size="12px" fill="#475569">P'(no) = 0.30 × 0.083 × 0.583 × 0.375 × 0.375 ≈ 0.00205</text>

    <!-- Visual Bar Representation -->
    <text x="16" y="172" class="bar-label" fill="#1e293b">Posterior P(yes): 96.44%  |  P(no): 3.56%</text>
    <rect x="16" y="178" width="393" height="14" rx="3" fill="#f87171" />
    <rect x="16" y="178" width="379" height="14" rx="3" fill="#16a34a" />
  </g>

  <!-- Summary Insight Bar -->
  <g transform="translate(40, 305)">
    <rect width="880" height="75" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5" />
    <text x="20" y="26" font-family="sans-serif" font-size="13px" font-weight="700" fill="#1e3a8a">Key Professor Defense Takeaway:</text>
    <text x="20" y="46" font-family="sans-serif" font-size="12px" fill="#334155">• <tspan font-weight="700">Classification Invariance:</tspan> In both cases, the final decision remains <tspan font-weight="700" fill="#16a34a">"yes"</tspan> because P(yes) ≫ P(no).</text>
    <text x="20" y="63" font-family="sans-serif" font-size="12px" fill="#334155">• <tspan font-weight="700">Calibration:</tspan> The m-estimate eliminates absolute overconfidence (100% vs 0%) and assigns a realistic posterior uncertainty (96.4% vs 3.6%).</text>
  </g>
</svg>